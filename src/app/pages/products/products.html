<div class="space-y-8 animate-in fade-in duration-500">
  <div class="text-center">
    <h2 class="text-3xl font-bold text-gray-900 tracking-tight">おすすめ商品</h2>
    <p class="mt-4 text-gray-500">当店が厳選したこだわりの品々をご覧ください。</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    @for (product of products; track product.id) {
      <div class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-100 group">
        <div class="relative overflow-hidden aspect-square bg-gray-50">
          <img [src]="product.image" [alt]="product.name" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
          <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-colors duration-300"></div>
        </div>
        <div class="p-5 flex flex-col justify-between h-[200px]">
          <div>
            <h3 class="text-[1.05rem] font-bold text-gray-900 mb-1 leading-tight">{{ product.name }}</h3>
            <p class="text-gray-500 text-sm mb-4 line-clamp-2 leading-relaxed">{{ product.description }}</p>
          </div>
          
          <div class="mt-auto">
            <p class="text-xl text-indigo-600 font-extrabold mb-3">¥{{ product.price | number }}</p>
            <button class="w-full py-2.5 px-4 bg-gray-900 hover:bg-indigo-600 text-white font-medium rounded-xl transition-colors shadow-sm cursor-pointer flex items-center justify-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
              カートに追加
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
